<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shreyas Seethalla</title>
  <style>
    :root { --bg: #f7f8fa; --surface: #fff; --text: #1d2330; --muted: #5b6475; --border: #dde1e8; --accent: #2f6fdb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12151b; --surface: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --border: #2c3340; --accent: #7aa7ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 4rem 16px; }
    h1 { margin: 0 0 .25rem; font-size: 2rem; }
    .intro { color: var(--muted); margin: 0 0 2rem; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
    a.card { display: block; padding: 1rem 1.25rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--accent); }
    a.card strong { color: var(--accent); }
    a.card span { display: block; color: var(--muted); font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Shreyas Seethalla</h1>
    <p class="intro">Physics, plasmas, and teaching tools.</p>
    <ul>
      <li><a class="card" href="/plasmaDemos/"><strong>Plasma Demos</strong><span>Interactive, no-code plasma physics for high-school students.</span></a></li>
      <li><a class="card" href="https://github.com/KasaiYuki"><strong>GitHub</strong><span>github.com/KasaiYuki</span></a></li>
    </ul>
  </main>
</body>
</html>
